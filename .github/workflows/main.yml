name: test

on: [workflow_dispatch, push]

env:
  CARGO_TERM_COLOR: never
  RUST_LOG_STYLE: never
  RUST_LOG: trace

concurrency:
  # cancel branch jobs on new pushs
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ubuntu-default:
    name: test | default
    runs-on: ubuntu-latest
    steps:
      - name: setup | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup | Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: setup | Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
      - name: build
        run: cargo build --locked
      - name: setup | Python venv
        run: rm -rf target/venv
      - name: test | unit-tests
        run: cargo test
      - name: test | clippy
        run: |
          cargo clippy -- -D warnings
          cargo clippy --message-format=json > target/clippy.json
      - name: upload | artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clippy-report
          path: target/clippy.json

  build-ubuntu-release:
    name: build | release
    runs-on: ubuntu-latest
    steps:
      - name: setup | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup | Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: build
        run: cargo build --release --locked
      - name: upload | artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries
          path: |
            target/release/ppm
            target/release/ppm-launcher
            target/release/ppm-daemon

  build-ubuntu-coverage:
    name: test | coverage
    runs-on: ubuntu-latest
    needs: [ build-ubuntu-default ]
    steps:
      - name: setup | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup | Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: setup | Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: llvm-tools
      - name: setup | cargo tools
        run: |
          cargo install --git "https://github.com/fargies/cargo-coverage"
          cargo install grcov
      - name: setup | Python venv
        run: rm -rf target/venv
      - name: test | coverage
        run: |
          # compile ppm-launcher that is used in tests
          RUSTFLAGS=-Cinstrument-coverage cargo build --locked
          cargo cover
      - name: upload | artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: target/coverage/output

  build:
    name: test | matrix
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [ build-ubuntu-coverage ]
    steps:
      - name: setup | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup | Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.x
      - name: setup | Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
        with:
          components: clippy
      - name: build
        run: cargo build --locked
      - name: setup | Python venv
        run: rm -rf target/venv
      - name: test | unit-tests
        run: cargo test -- --no-capture
      - name: test | clippy
        run: cargo clippy -- -D warnings

  report-coveralls:
    name: report | coveralls
    runs-on: ubuntu-latest
    needs: [ build-ubuntu-coverage ]
    steps:
      - name: setup | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup | artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-report
      - name: report | Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8

  report-sonar:
    name: report
    needs: [ build-ubuntu-default, build-ubuntu-coverage ]
    permissions:
      contents: read
      id-token: write
    uses: $/.github/workflows/sonar.yml
    with:
      sonar-args: >
        -Dsonar.coverage.exclusions=/website/**
        -Dsonar.rust.lcov.reportPaths=artifacts/lcov.info
        -Dsonar.rust.clippyReport.reportPaths=artifacts/clippy.json

  changelog:
    name: test | changelog
    runs-on: ubuntu-latest
    steps:
      - name: setup | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: test | ChangeLog
        uses: docker://alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf # 3.24.4
        env:
          RUST_LOG: warn
        with:
          args: |
            /bin/sh -c "printf '[safe]\ndirectory = *\n' > /etc/gitconfig && apk add git-cliff && git-cliff -u && echo Ok"
