name: test

on: [workflow_dispatch, push]

env:
  CARGO_TERM_COLOR: never
  RUST_LOG_STYLE: never
  RUST_LOG: trace

concurrency:
  # cancel branch jobs on new pushs
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-ubuntu-default:
    name: test | default
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v5.1.0
      - name: Install Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.x
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: clippy
      - name: Build project
        run: cargo build
      - name: Prepare Python
        run: rm -rf target/venv
      - name: Run tests
        run: cargo test
      - name: Run clippy
        run: cargo clippy -- -D warnings

  build-ubuntu-release:
    name: build | release
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v5.1.0
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
      - name: Build project
        run: cargo build --release
      - name: Deploy | Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: binaries
          path: |
            target/release/ppm
            target/release/ppm-launcher
            target/release/ppm-daemon

  build-ubuntu-coverage:
    name: test | coverage
    runs-on: ubuntu-latest
    needs: [ build-ubuntu-default ]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v5.1.0
      - name: Install Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.x
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: llvm-tools
      - name: Install cargo-coverage
        run: |
          cargo install --git "https://github.com/fargies/cargo-coverage"
          cargo install grcov
      - name: Prepare Python
        run: rm -rf target/venv
      - name: Run tests with coverage
        run: |
          # compile ppm-launcher that is used in tests
          RUSTFLAGS=-Cinstrument-coverage cargo build
          cargo cover
      - name: Coveralls
        uses: coverallsapp/github-action@v2.3.8

  build:
    name: test | matrix
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: [ build-ubuntu-coverage ]
    steps:
      - name: Fetch sources
        uses: actions/checkout@v5.1.0
      - name: Install Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.x
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: clippy
      - name: Build project
        run: cargo build
      - name: Prepare Python
        run: rm -rf target/venv
      - name: Run tests
        run: cargo test -- --no-capture
      - name: Run clippy
        run: cargo clippy -- -D warnings

  changelog:
    name: test | changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: Generate ChangeLog
        uses: docker://alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf # 3.24.4
        env:
          RUST_LOG: warn
        with:
          args: |
            /bin/sh -c "printf '[safe]\ndirectory = *\n' > /etc/gitconfig && apk add git-cliff && git-cliff -u && echo Ok"
