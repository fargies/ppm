name: sonar
on:
  workflow_call:
    inputs:
      sonar-args:
        type: string
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: setup | checkout
        uses: actions/checkout@v5.1.0
        with:
          fetch-tags: true
          fetch-depth: 0
      - name: setup | cache SonarQube packages
        uses: actions/cache@v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: setup | artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
          pattern: "*-report"
          merge-multiple: true
      - name: setup | auth
        uses: SonarSource/sonarqube-auth-action@v1.2
        id: auth
      - run: ls artifacts
      - name: test | SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        with:
          args: >
            ${{ inputs.sonar-args }}
            -Dsonar.exclusions=artifacts/**
            -Dsonar.organization=${{ steps.auth.outputs.organization }}
            -Dsonar.projectKey=${{ steps.auth.outputs.project-key }}
