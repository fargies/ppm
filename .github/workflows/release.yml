name: release
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

jobs:
  github_build:
    name: Build release binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: partner-pm-linux-amd64.tar.gz
            arch: x86_64

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: partner-pm-linux-arm64.tar.gz
            arch: aarch64

    runs-on: ${{ matrix.os }}
    steps:
      - name: setup | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cache files between builds
      - name: setup | cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: setup | Rust
        uses: actions-rs/toolchain@b2417cde72dcf67f306c0ae8e0828a81bf0b189f # v1.0.6
        with:
          toolchain: stable
          override: true
          profile: minimal
          target: ${{ matrix.target }}

      - name: test | version-tag
        run: |
          set -euo pipefail
          cargo_version=$(cargo metadata --no-deps --format-version 1 --frozen | jq -r '.packages[0].version')
          tag_ref="${GITHUB_REF##*/}"
          tag_version="${tag_ref#v}"

          if [ "$tag_version" != "$cargo_version" ]; then
            echo "❌ Tag version '$tag_ref' does not match Cargo.toml version '$cargo_version'" 1>&2
            exit 1
          fi

          echo "✅ Version match confirmed: $tag_version"
      - name: build | build
        uses: actions-rs/cargo@ae10961054e4aa8b4aa7dffede299aaf087aa33b # v1.0.1
        with:
          command: build
          args: --manifest-path Cargo.toml --release --target ${{ matrix.target }}'
          use-cross: ${{ matrix.os == 'ubuntu-latest' }}

      - name: setup | artifacts
        run: |
          cd target/${{ matrix.target }}/release
          # TODO: investigate better cross platform stripping
          strip ppm ppm-daemon ppm-launcher || true
          tar czvf ../../../${{ matrix.name }} ppm ppm-daemon ppm-launcher
          cd -

      - name: test | bin
        if: matrix.arch == 'x86_64'
        run: |
          cd target/${{ matrix.target }}/release
          ./ppm --version
          cd -

      - name: upload | artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  github_release:
    name: Create GitHub Release
    needs: github_build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: setup | checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: setup | artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-dist

      - name: setup | checksums
        run: |
          ls -lha release-dist
          for file in release-dist/**/*; do openssl dgst -sha256 -r "$file" | awk '{print $1}' > "${file}.sha256"; done

      - name: publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: release-dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
